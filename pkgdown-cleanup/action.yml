name: "Clean up pkgdown preview"
description: "Removes the pkgdown preview directory when a PR is closed."
inputs:
  repository-name:
    description: "Repository to clean up."
    default: ${{ github.event.repository.name }}
  repository-owner:
    description: "Owner of the repository to clean up."
    default: ${{ github.repository_owner }}
  token:
    description: "GitHub token, typically set to secrets.GITHUB_TOKEN"
    default: ${{ github.token }}
  ref:
    description: "Branch to checkout."
    default: 'gh-pages'
  pr-number:
    description: "Pull request number."
    default: ${{ github.event.number }}
runs:
  using: "composite"
  steps:
    - name: Checkout gh-pages branch
      uses: actions/checkout@v6
      with:
        repository: ${{ inputs.repository-owner }}/${{ inputs.repository-name }}
        token: ${{ inputs.token }}
        ref: ${{ inputs.ref }}
    - name: Remove PR preview directory
      shell: bash
      run: |
        pr_dir="pr/${{ inputs.pr-number }}"
        if [ -d "$pr_dir" ]; then
          git config --local user.name "$GITHUB_ACTOR"
          git config --local user.email "$GITHUB_ACTOR@users.noreply.github.com"
          git rm -rf "$pr_dir"
          git commit -m "Remove preview for PR #${{ inputs.pr-number }}"
          git push
        else
          echo "Directory $pr_dir does not exist, skipping cleanup."
        fi
