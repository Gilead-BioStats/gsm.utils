name: "Coverage PR Comment"
description: "Formats coverage data and posts a sticky PR comment."

inputs:
  token:
    description: "GitHub token (usually secrets.GITHUB_TOKEN)"
    required: true
    default: ${{ github.token }}

runs:
  using: "composite"
  steps:
    - name: Prepare Coverage Comment Body
      if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
      shell: bash
      run: |
        PCT="${{ env.COVERAGE_PCT }}"
        if [ "$PCT" == "NA" ]; then
          echo "⚠️ Coverage computation failed." > pr_comment.md
        else
          echo "📊 Test coverage: **${PCT}%**" > pr_comment.md

          if [ -f "coverage-data.json" ]; then
            echo "" >> pr_comment.md
            echo "<details>" >> pr_comment.md
            echo "<summary>Per-file coverage</summary>" >> pr_comment.md
            echo "" >> pr_comment.md
            echo "| File | Coverage |" >> pr_comment.md
            echo "|------|----------|" >> pr_comment.md
            jq -r '.[] | "| `\(.file)` | \(.coverage)% |"' coverage-data.json >> pr_comment.md
            echo "" >> pr_comment.md
            echo "</details>" >> pr_comment.md
          fi
        fi

    - name: Comment coverage on PR
      if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
      continue-on-error: true
      uses: gilead-biostats/gsm.utils/comment-pr@fix-78-comment-pr
      with:
        comment-id: 'coverage-comment'
        body-path: 'pr_comment.md'
        token: ${{ inputs.token }}
