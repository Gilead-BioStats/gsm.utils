# name: r-releaser.yaml
# version: 0.4.0
# Description: Reusable R package release workflow designed to be invoked by
# other gsm packages via r-releaser-caller.yaml workflow
name: R Release
on:
  workflow_call:
    inputs:
      tag:
        description: Tag to release
        required: true
        type: string
      use-app:
        description: "Whether to generate a GitHub App token instead of using the default token."
        type: boolean
        default: false
    secrets:
      token:
        description: "GitHub token, set to secrets.GITHUB_TOKEN"
        required: false
      CM_BOT_APP_ID:
        required: false
      CM_BOT_PRIVATE_KEY:
        required: false
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Generate token
        uses: gilead-biostats/gsm.utils/generate-token@fix-130-app-tokens
        id: token
        with:
          use-app: ${{ inputs.use-app && 'true' || 'false' }}
          app-id: ${{ secrets.CM_BOT_APP_ID }}
          private-key: ${{ secrets.CM_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          fallback-token: ${{ secrets.token || github.token }}
      - name: Set GITHUB_PAT
        run: echo "GITHUB_PAT=${{ steps.token.outputs.token }}" >> $GITHUB_ENV
      - name: Check out repo
        uses: gilead-biostats/gsm.utils/checkout@actions-v1
        with:
          fetch-depth: 0
      - name: Install R and dependencies
        uses: gilead-biostats/gsm.utils/install@actions-v1
        with:
          use-public-rspm: true
          dependencies: '"hard"'
          token: ${{ steps.token.outputs.token }}
      - name: get library path
        id: library
        run: |
          OUTPUT=$(Rscript -e "cat(.libPaths()[1])")
          echo "result=$OUTPUT" >> $GITHUB_OUTPUT
          echo $GITHUB_OUTPUT
      - name: Run R Releaser
        id: releaser
        uses: A2-ai/r-releaser/build-src@main
        with:
          library: ${{ steps.library.outputs.result }}
          resave-data: false
          md5: true
          build-vignettes: false
      - name: echo output
        run: |
          echo ${{ steps.releaser.outputs.tarball_path }}
          echo ${{ steps.releaser.outputs.tarball_name }}
      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ steps.token.outputs.token }}
          file: ${{ steps.releaser.outputs.tarball_path }}
          asset_name: ${{ steps.releaser.outputs.tarball_name }}
          tag: ${{ inputs.tag }}
          overwrite: true
