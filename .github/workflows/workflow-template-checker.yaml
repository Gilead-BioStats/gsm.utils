# name: workflow-template-checker.yaml
# version: 0.3.6
# Description: Reusable workflow template checker designed to be invoked via workflow-template-check.yaml
name: Workflow Template Compliance Checker

on:
  workflow_call:

jobs:
  check-workflows:
    runs-on: ubuntu-latest
    name: Check Workflow Templates
    steps:
      - name: Check out repo
        uses: gilead-biostats/gsm.utils/checkout@actions-v1
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Check compliance, auto-fix, and build comment
        id: check
        run: |
          BASE_URL="https://raw.githubusercontent.com/Gilead-BioStats/gsm.utils/fix-107-action_permissions"
          MANIFEST_URL="$BASE_URL/gha_version.json"

          echo "Downloading manifest from $MANIFEST_URL..."
          curl -sL -f "$MANIFEST_URL" -o gha_version.json || { echo "::error::Failed to download manifest"; exit 1; }

          BODY_FILE="comment_body.md"
          touch "$BODY_FILE"
          HAS_ERRORS="false"

          # Use jq to iterate over workflows
          jq -c '.workflows[]' gha_version.json > manifest_workflows.jsonl

          # Ensure target directory exists before curl attempts to write to it
          mkdir -p .github/workflows

          while read -r item; do
            name=$(echo "$item" | jq -r '.name')
            target_version=$(echo "$item" | jq -r '.version')
            local_file=".github/workflows/$name"

            ISSUE_FOUND="false"

            if [ ! -f "$local_file" ]; then
              ISSUE_FOUND="true"
              echo "Identified missing workflow: $name"
            else
              # Extract local version, stripping potential Windows carriage returns
              local_version=$(grep -m 1 "^# version:" "$local_file" | awk '{print $3}' | tr -d '\r')
              if [ -z "$local_version" ]; then
                local_version="unknown"
              fi

              # Extract local name, stripping potential Windows carriage returns
              local_name=$(grep -m 1 "^# name:" "$local_file" | awk '{print $3}' | tr -d '\r')
              if [ -z "$local_name" ]; then
                local_name="unknown"
              fi

              if [ "$local_version" != "$target_version" ] || [ "$local_name" != "$name" ]; then
                ISSUE_FOUND="true"
                echo "Identified outdated or mismatched workflow: $name (local version: $local_version, local name: $local_name, target: $target_version)"
              else
                echo "Identified compliant workflow: $name"
              fi
            fi

            if [ "$ISSUE_FOUND" = "true" ]; then
              if [ "$HAS_ERRORS" = "false" ]; then
                echo "## ⚠️ Workflow Template Compliance Auto-Fixes" > "$BODY_FILE"
                echo "" >> "$BODY_FILE"
                echo "The following workflows were missing or outdated and have been automatically updated to match the canonical templates:" >> "$BODY_FILE"
                echo "" >> "$BODY_FILE"
                HAS_ERRORS="true"
              fi

              # Automatically download and overwrite the file
              curl -sL "$BASE_URL/workflow_templates/$name" -o "$local_file"

              # Add to the bulleted list
              echo "- \`$name\`" >> "$BODY_FILE"
            fi
          done < manifest_workflows.jsonl

          if [ "$HAS_ERRORS" = "false" ]; then
            echo "## ✅ All workflows are up to date" > "$BODY_FILE"
          fi

          echo "has_errors=$HAS_ERRORS" >> $GITHUB_OUTPUT

      - name: Post PR Comment
        uses: gilead-biostats/gsm.utils/comment-pr@actions-v1
        with:
          comment-id: 'workflow-template-check'
          body-path: comment_body.md
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit fixes
        if: ${{ steps.check.outputs.has_errors == 'true' }}
        run: |
          git config --local user.name "$GITHUB_ACTOR"
          git config --local user.email "$GITHUB_ACTOR@users.noreply.github.com"
          git add .github/workflows/
          git commit -m 'chore: automatically update workflow templates'

      - name: Push changes
        if: ${{ steps.check.outputs.has_errors == 'true' }}
        uses: r-lib/actions/pr-push@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail check if updates required
        if: ${{ steps.check.outputs.has_errors == 'true' }}
        run: |
          echo "One or more workflows required an update. The updates have been committed and pushed."
          echo "Failing this check so the newly pushed commit can trigger a clean run."
          exit 1
