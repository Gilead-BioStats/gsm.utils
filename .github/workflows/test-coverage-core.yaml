# name: test-coverage-core.yaml
# version: 0.4.0
# Description: Reusable workflow to compute test coverage and publish coverage-summary.json artifact

name: test-coverage-core

on:
  workflow_call:
    inputs:
      use-app:
        description: "Whether to generate a GitHub App token instead of using the default token."
        type: boolean
        default: false
    secrets:
      token:
        description: "GitHub token, set to secrets.GITHUB_TOKEN"
        required: false
      CM_BOT_APP_ID:
        required: false
      CM_BOT_PRIVATE_KEY:
        required: false

jobs:
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Generate token
        uses: gilead-biostats/gsm.utils/generate-token@fix-130-app-tokens
        id: token
        with:
          use-app: ${{ inputs.use-app && 'true' || 'false' }}
          app-id: ${{ secrets.CM_BOT_APP_ID }}
          private-key: ${{ secrets.CM_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          fallback-token: ${{ secrets.token || github.token }}
      - name: Compute test coverage
        uses: gilead-biostats/gsm.utils/coverage@actions-v1
        with:
          token: ${{ steps.token.outputs.token }}
