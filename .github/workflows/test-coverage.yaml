# gsm.utils GHA version: 0.2.0
# Generated by: https://github.com/Gilead-BioStats/gsm.utils
# Description: Compute test coverage and publish coverage-summary.json artifact

on:
  push:
    branches: [main, dev]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to attach coverage-summary.json to (for testing only)'
        required: false
        default: ''

name: test-coverage

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, local::., Gilead-BioStats/gsm.utils
          needs: coverage

      - name: Compute coverage and write summary
        shell: Rscript {0}
        run: |
          gsm.utils::emit_coverage_summary(
            output_path = "coverage-summary.json",
            quiet       = FALSE
          )

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary
          path: coverage-summary.json

      - name: Attach coverage summary to release
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.tag_name != '')
        run: gh release upload ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag_name }} coverage-summary.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
