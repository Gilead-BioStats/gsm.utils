# gsm.utils GHA version: 0.2.0
# Generated by: https://github.com/Gilead-BioStats/gsm.utils
# Description: Compute test coverage; log results, post sticky PR comments, and attach coverage-summary.json to releases

on:
  push:
    branches: [main, dev]
  pull_request:
    types: [opened, synchronize, reopened]
  release:
    types: [published]
  workflow_dispatch:

name: test-coverage

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, local::., Gilead-BioStats/gsm.utils
          needs: coverage

      - name: Compute coverage
        shell: Rscript {0}
        run: |
          pct <- tryCatch(
            {
              cov <- covr::package_coverage()
              as.numeric(covr::percent_coverage(cov))
            },
            error = function(e) {
              message("Coverage computation failed: ", conditionMessage(e))
              NA_real_
            }
          )
          cat(
            sprintf("COVERAGE_PCT=%s\n", if (is.na(pct)) "NA" else sprintf("%.2f", pct)),
            file = Sys.getenv("GITHUB_ENV"),
            append = TRUE
          )

      - name: Log coverage
        run: echo "Coverage: ${{ env.COVERAGE_PCT }}%"

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const pct = process.env.COVERAGE_PCT;
            const sha = context.sha.slice(0, 7);
            const timestamp = new Date().toISOString().replace(/\.\d{3}Z$/, 'Z');
            const marker = '<!-- coverage-comment -->';
            const body = pct === 'NA'
              ? `${marker}\n⚠️ Coverage computation failed.\n\n_Commit: ${sha} | ${timestamp}_`
              : `${marker}\n📊 Test coverage: **${pct}%**\n\n_Commit: ${sha} | ${timestamp}_`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.user.login === 'github-actions[bot]' && c.body.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Write coverage-summary.json
        if: github.event_name == 'release'
        shell: Rscript {0}
        run: |
          gsm.utils::emit_coverage_summary(
            output_path = "coverage-summary.json",
            quiet       = FALSE
          )

      - name: Attach coverage summary to release
        if: github.event_name == 'release'
        run: gh release upload ${{ github.event.release.tag_name }} coverage-summary.json --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
