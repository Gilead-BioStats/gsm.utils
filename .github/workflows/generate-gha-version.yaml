# name: generate-gha-version.yaml
# version: 0.1.1
# Description: Update gha_version.json with latest templates.
name: Generate Workflow Version JSON

on:
  pull_request:
    branches:
      - 'actions-v1'

permissions:
  contents: write
  pull-requests: write

jobs:
  update-json:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: gilead-biostats/gsm.utils/checkout@actions-v1
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Parse YAML headers and generate JSON
        shell: python
        run: |
          import os, json, re, glob

          LOCAL_REPO = "Gilead-BioStats/gsm.utils"
          LOCAL_REF = "actions-v1"
          LOCAL_PATH_EXTRA = "workflow_templates"

          pattern_name = re.compile(r'^#\s*name:\s*(.*)', re.I)
          pattern_desc = re.compile(r'^#\s*description:\s*(.*)', re.I)
          pattern_version = re.compile(r'^#\s*version:\s*(.*)', re.I)

          # Load existing entries from other repos to preserve them
          existing_other = []
          if os.path.isfile('gha_version.json'):
              with open('gha_version.json', 'r') as f:
                  existing = json.load(f)
              existing_other = [
                  w for w in existing.get('workflows', [])
                  if w.get('repo') and w.get('repo') != LOCAL_REPO
              ]

          # Parse local workflow_templates
          local_workflows = []
          if os.path.isdir(LOCAL_PATH_EXTRA):
              for filepath in sorted(glob.glob(f'{LOCAL_PATH_EXTRA}/*.yaml')):
                  with open(filepath, 'r') as f:
                      w_name, w_version, w_desc = None, None, None

                      for line in f:
                          if not line.strip().startswith('#'):
                              break

                          if m := pattern_name.match(line):
                              w_name = m.group(1).strip()
                          elif m := pattern_version.match(line):
                              w_version = m.group(1).strip()
                          elif m := pattern_desc.match(line):
                              w_desc = m.group(1).strip()

                  if w_name and w_version and w_desc:
                      local_workflows.append({
                          "name": w_name,
                          "description": w_desc,
                          "version": w_version,
                          "repo": LOCAL_REPO,
                          "ref": LOCAL_REF,
                          "path_extra": LOCAL_PATH_EXTRA
                      })

          workflows = local_workflows + existing_other

          with open('gha_version.json', 'w') as f:
              json.dump({"workflows": workflows}, f, indent=2)
              f.write('\n')

      - name: Check for changes
        id: check
        run: |
          if [ -n "$(git status --porcelain gha_version.json)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit fixes
        if: ${{ steps.check.outputs.has_changes == 'true' }}
        run: |
          git config --local user.name "$GITHUB_ACTOR"
          git config --local user.email "$GITHUB_ACTOR@users.noreply.github.com"
          git add gha_version.json
          git commit -m 'chore: auto-update gha_version.json from templates'
          git pull --rebase origin ${{ github.head_ref || github.ref_name }}

      - name: Push changes
        if: ${{ steps.check.outputs.has_changes == 'true' }}
        uses: r-lib/actions/pr-push@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
