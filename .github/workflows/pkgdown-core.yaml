# name: pkgdown-core.yaml
# version: 0.3.7
# Description: Reusable workflow to deploy pkgdown site with assets and clean up PR previews.
name: pkgdown-core
on:
  workflow_call:
    inputs:
      mode:
        description: "Mode to run: deploy or cleanup"
        default: 'deploy'
        type: string
      pr-number:
        description: "Pull request number. Leave blank to deploy to a branch."
        type: string
      pkgdown-dev-mode:
        description: "Whether pkgdown should operate in dev mode."
        type: boolean
        default: false
      utils-ref:
        description: "Ref for gsm.utils to install"
        type: string
        default: '@*release'
    secrets:
      token:
        description: "GitHub token, set to secrets.GITHUB_TOKEN"
        required: false
jobs:
  pkgdown-assets:
    if: |
      (github.event_name == 'push') ||
      (github.event_name == 'pull_request' && github.event.action != 'closed') ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'deploy')
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.token || github.token }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Determine checkout ref
        id: get-ref
        if: github.event_name == 'workflow_dispatch'
        uses: gilead-biostats/gsm.utils/determine-ref@actions-v1
        with:
          pr-number: ${{ inputs.pr-number }}
          token: ${{ secrets.token || github.token }}
      - name: Check out repo
        uses: gilead-biostats/gsm.utils/checkout@actions-v1
        with:
          ref: ${{ steps.get-ref.outputs.ref }}
      - name: Install R and dependencies
        uses: gilead-biostats/gsm.utils/install@actions-v1
        with:
          token: ${{ secrets.token || github.token }}
          r-version: release
          needs: website
          extra-packages: any::pkgdown gilead-biostats/gsm.utils${{ inputs.utils-ref }} local::.
          cache-version: '1'
      - name: Build and deploy site
        uses: gilead-biostats/gsm.utils/pkgdown-deploy@actions-v1
        with:
          token: ${{ secrets.token || github.token }}
          event-name: ${{ inputs.pr-number && 'pull_request' || github.event_name }}
          pr-number: ${{ inputs.pr-number || github.event.number }}
          pkgdown-dev-mode: ${{ inputs.pkgdown-dev-mode == true || (github.event_name != 'workflow_dispatch' && github.ref_name != 'main') }}
          is-fork: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
  clean-pr-preview:
    if: |
      (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'cleanup')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Clean up PR preview
        uses: gilead-biostats/gsm.utils/pkgdown-cleanup@actions-v1
        with:
          token: ${{ secrets.token || github.token }}
          pr-number: ${{ inputs.pr-number || github.event.number }}
