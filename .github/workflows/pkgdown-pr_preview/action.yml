name: "Deploy PR preview"
description: "Deploy a pkgdown preview for a pull request."
inputs:
  token:
    description: "GitHub token, set to secrets.GITHUB_TOKEN"
    required: false
    default: ${{ github.token }}
  pr_number:
    description: "Pull request number."
    required: false
    default: ${{ github.event.number }}
  repository_name:
    description: "Repository to which to deploy."
    required: false
    default: ${{ github.event.repository.name }}

runs:
  using: "composite"
  steps:
    # - name: Deploy PR preview 🧪
    #   uses: JamesIves/github-pages-deploy-action@v4.5.0
    #   with:
    #     token: ${{ inputs.token }}
    #     repository-name: gilead-biostats/${{ inputs.repository_name }}
    #     # Don't clean the whole branch, just the target folder
    #     clean: false
    #     branch: gh-pages
    #     folder: docs
    #     # Deploy to a subdirectory named after the PR number
    #     target-folder: pr/${{ inputs.pr_number }}
    #
    # - name: PR site URL 🌐
    #   shell: bash
    #   run: |
    #     echo "🌐 URL: https://gilead-biostats.github.io/${{ inputs.repository_name }}/pr/${{ inputs.pr_number }}/dev"

    - name: Comment with PR site URL 🌐
      uses: actions/github-script@v6
      with:
        script: |
          const prSiteURL = `https://${context.repo.owner}.github.io/${context.workflow.inputs.repository_name}/pr/${context.issue.number}/dev`
          const timestamp = new Date().toISOString();
          const commentBody = `🌐 PR pkgdown deployed: [${prSiteURL}](${prSiteURL})\n\n_Last updated: ${timestamp}_`;
          const commentMarker = '🌐 PR pkgdown deployed:';

          // Get all comments on the PR
          const comments = await github.rest.issues.listComments({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
          });

          // Find existing comment from this bot
          const existingComment = comments.data.find(comment =>
            comment.user.login === 'github-actions[bot]' &&
            comment.body.includes(commentMarker)
          );

          if (existingComment) {
            // Update existing comment
            await github.rest.issues.updateComment({
              comment_id: existingComment.id,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: commentBody,
            });
          } else {
            // Create new comment
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: commentBody,
            });
          }
