name: "Test Coverage"
description: "Compute test coverage; log results, post sticky PR comments, and attach coverage-summary.json to releases"

inputs:
  token:
    description: "GitHub token (usually secrets.GITHUB_TOKEN)"
    required: true
    default: ${{ github.token }}
  utils-ref:
    description: "Ref for gsm.utils to install"
    default: '@*release'

runs:
  using: "composite"
  steps:
    - name: Check out repo
      uses: gilead-biostats/gsm.utils/checkout@fix-bash-runner
      with:
        token: ${{ inputs.token }}

    - name: Install R and dependencies
      uses: gilead-biostats/gsm.utils/install@fix-bash-runner
      with:
        token: ${{ inputs.token }}
        extra-packages: any::covr any::xml2 any::jsonlite gilead-biostats/gsm.utils${{ inputs.utils-ref }} local::.
        needs: coverage

    - name: Compute coverage
      uses: gilead-biostats/gsm.utils/coverage-compute@fix-bash-runner
      with:
        token: ${{ inputs.token }}

    - name: Handle PR Coverage Comments
      if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
      uses: gilead-biostats/gsm.utils/coverage-comment-pr@fix-bash-runner
      with:
        token: ${{ inputs.token }}

    - name: Handle Release Summaries
      if: github.event_name == 'release'
      uses: gilead-biostats/gsm.utils/coverage-release@fix-bash-runner
      with:
        token: ${{ inputs.token }}
