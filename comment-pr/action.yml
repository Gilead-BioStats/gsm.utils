name: 'Create or Update PR Comment'
description: 'Posts a new comment or updates an existing one on a PR.'
inputs:
  comment-id:
    description: 'Unique identifier used as an invisible HTML marker in the comment.'
    required: true
  body:
    description: 'Direct string content for the comment body. Used if body-path is not provided.'
  body-path:
    description: 'Path to a text/markdown file containing the comment body.'
  pr-number:
    description: 'Pull Request number. Defaults to the current context issue number.'
    default: ${{ github.event.number }}
  append-metadata:
    description: 'Whether to append the action URL and timestamp footer to the comment.'
    default: 'true'
  token:
    description: 'GitHub token for API calls'
    default: ${{ github.token }}
runs:
  using: "composite"
  steps:
    - name: Execute comment script
      uses: actions/github-script@v7
      env:
        COMMENT_ID: ${{ inputs.comment-id }}
        BODY_TEXT: ${{ inputs.body }}
        BODY_PATH: ${{ inputs.body-path }}
        PR_NUMBER: ${{ inputs.pr-number }}
        APPEND_META: ${{ inputs.append-metadata }}
      with:
        github-token: ${{ inputs.token }}
        script: |
          const fs = require('fs');
          const commentId = process.env.COMMENT_ID;
          let bodyText = process.env.BODY_TEXT;
          const bodyPath = process.env.BODY_PATH;

          // 1. Resolve comment body
          if (bodyPath) {
            if (fs.existsSync(bodyPath)) {
              bodyText = fs.readFileSync(bodyPath, 'utf8');
            } else {
              core.setFailed(`body-path provided but file does not exist: ${bodyPath}`);
              return;
            }
          } else if (!bodyText) {
            core.setFailed('Must provide either `body` or `body-path`.');
            return;
          }

          // 2. Construct the invisible marker
          const marker = `<!-- ${commentId} -->`;

          // 3. Construct optional metadata footer
          let metadata = '';
          if (process.env.APPEND_META === 'true') {
            const timestamp = new Date().toISOString().replace(/\.\d{3}Z$/, 'Z');
            let actionUrl = `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            try {
              const { data: jobsData } = await github.rest.actions.listJobsForWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId,
              });
              if (jobsData.jobs && jobsData.jobs.length === 1) {
                actionUrl = jobsData.jobs[0].html_url;
              }
            } catch (e) {
              core.warning(`Could not fetch jobs for run: ${e.message}`);
            }

            metadata = `\n\n_Generated by [this GitHub Action](${actionUrl}). Updated: ${timestamp}_`;
          }

          const finalBody = `${marker}\n${bodyText}${metadata}`;

          // 4. Resolve Issue/PR Number
          const issueNumber = process.env.PR_NUMBER ? Number(process.env.PR_NUMBER) : context.issue.number;
          if (!issueNumber) {
            core.setFailed('Could not determine issue/PR number from inputs or context.');
            return;
          }

          const repoOwner = context.repo.owner;
          const repoName = context.repo.repo;

          // 5. Check for existing comment by marker
          const comments = await github.paginate(github.rest.issues.listComments, {
            owner: repoOwner,
            repo: repoName,
            issue_number: issueNumber,
          });

          const matches = comments.filter(c => c.body.includes(marker));

          // 6. Delete duplicates, then create or update
          if (matches.length > 1) {
            for (const dup of matches.slice(1)) {
              await github.rest.issues.deleteComment({
                owner: repoOwner,
                repo: repoName,
                comment_id: dup.id,
              });
              core.info(`Deleted duplicate comment ${dup.id}`);
            }
          }

          const existing = matches[0];
          if (existing) {
            await github.rest.issues.updateComment({
              owner: repoOwner,
              repo: repoName,
              comment_id: existing.id,
              body: finalBody,
            });
            core.info(`Updated existing comment ${existing.id}`);
          } else {
            const created = await github.rest.issues.createComment({
              owner: repoOwner,
              repo: repoName,
              issue_number: issueNumber,
              body: finalBody,
            });
            core.info(`Created new comment ${created.id}`);
          }
