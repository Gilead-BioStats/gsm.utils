name: "Generate Token"
description: "Conditionally generates a GitHub App token or falls back to the default token."
inputs:
  use-app:
    description: "Whether to generate an app token. When 'false', outputs the default github.token."
    default: "false"
  app-id:
    description: "GitHub App ID. Required when use-app is 'true'."
    default: ""
  private-key:
    description: "GitHub App private key. Required when use-app is 'true'."
    default: ""
  owner:
    description: "Owner for the app token (typically github.repository_owner)."
    default: ${{ github.repository_owner }}
  fallback-token:
    description: "Token to use when use-app is 'false'."
    default: ${{ github.token }}
outputs:
  token:
    description: "The generated token (app token or fallback)."
    value: ${{ steps.select.outputs.token }}
runs:
  using: "composite"
  steps:
    - name: Generate app token
      if: inputs.use-app == 'true'
      uses: actions/create-github-app-token@v1
      id: app-token
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        owner: ${{ inputs.owner }}
    - name: Select token
      id: select
      shell: bash
      run: |
        if [ "${{ inputs.use-app }}" = "true" ]; then
          echo "token=${{ steps.app-token.outputs.token }}" >> "$GITHUB_OUTPUT"
        else
          echo "token=${{ inputs.fallback-token }}" >> "$GITHUB_OUTPUT"
        fi
