name: "Generate Token"
description: "Generates a GitHub App token when app-id and app-private-key are provided, otherwise falls back to the default token."
inputs:
  app-id:
    description: "GitHub App ID. When both app-id and app-private-key are provided, an app token is generated."
    default: ""
  app-private-key:
    description: "GitHub App private key. When both app-id and app-private-key are provided, an app token is generated."
    default: ""
  owner:
    description: "Owner for the app token (typically github.repository_owner)."
    default: ${{ github.repository_owner }}
  fallback-token:
    description: "Token to use when app-id/app-private-key are not provided."
    default: ${{ github.token }}
outputs:
  token:
    description: "The generated token (app token or fallback)."
    value: ${{ steps.select.outputs.token }}
runs:
  using: "composite"
  steps:
    - name: Determine token strategy
      id: strategy
      shell: bash
      run: |
        if [ -n "${{ inputs.app-id }}" ] && [ -n "${{ inputs.app-private-key }}" ]; then
          echo "use-app=true" >> "$GITHUB_OUTPUT"
        else
          echo "use-app=false" >> "$GITHUB_OUTPUT"
        fi
    - name: Generate app token
      if: steps.strategy.outputs.use-app == 'true'
      uses: actions/create-github-app-token@v1
      id: app-token
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.app-private-key }}
        owner: ${{ inputs.owner }}
    - name: Select token
      id: select
      shell: bash
      run: |
        if [ "${{ steps.strategy.outputs.use-app }}" = "true" ]; then
          echo "token=${{ steps.app-token.outputs.token }}" >> "$GITHUB_OUTPUT"
        else
          echo "token=${{ inputs.fallback-token }}" >> "$GITHUB_OUTPUT"
        fi
