# gsm.utils GHA version: 0.2.0
# Generated by: https://github.com/Gilead-BioStats/gsm.utils
# Description: Compute test coverage and publish coverage-summary.json artifact

on:
  push:
    branches: [main, dev]
  release:
    types: [published]
  workflow_dispatch:

name: test-coverage

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, local::., Gilead-BioStats/gsm.utils
          needs: coverage

      - name: Compute coverage and write summary
        shell: Rscript {0}
        run: |
          gsm.utils::emit_coverage_summary(
            output_path = "coverage-summary.json",
            quiet       = FALSE
          )

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary
          path: coverage-summary.json

      - name: Publish coverage summary to coverage-data branch
        if: github.event_name == 'push'
        run: |
          cp coverage-summary.json /tmp/coverage-summary.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin
          git switch coverage-data 2>/dev/null || git switch -c coverage-data
          mkdir -p ${{ github.ref_name }}
          cp /tmp/coverage-summary.json ${{ github.ref_name }}/coverage-summary.json
          git add ${{ github.ref_name }}/coverage-summary.json
          git diff --staged --quiet || git commit -m "chore: update ${{ github.ref_name }}/coverage-summary.json [skip ci]"
          git push origin coverage-data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach coverage summary to release
        if: github.event_name == 'release'
        run: gh release upload ${{ github.event.release.tag_name }} coverage-summary.json --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
