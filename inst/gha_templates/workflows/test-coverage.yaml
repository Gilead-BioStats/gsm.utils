# gsm.utils GHA version: 0.2.0
# Generated by: https://github.com/Gilead-BioStats/gsm.utils
# Description: Compute test coverage and publish coverage-summary.json artifact

on:
  push:
    branches: [main, dev]
  release:
    types: [published]
  workflow_dispatch:

name: test-coverage

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      GIST_TOKEN: ${{ secrets.GIST_TOKEN }}

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, local::., Gilead-BioStats/gsm.utils
          needs: coverage

      - name: Compute coverage and write summary
        shell: Rscript {0}
        run: |
          gsm.utils::emit_coverage_summary(
            output_path = "coverage-summary.json",
            quiet       = FALSE
          )

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary
          path: coverage-summary.json

      - name: Update coverage badge gist
        if: env.GIST_TOKEN != ''
        run: |
          COVERAGE_RAW=$(jq -r '.coverage_percent // empty' coverage-summary.json)
          if [ -z "$COVERAGE_RAW" ]; then
            MSG="error"; COLOR="red"
          else
            MSG="$(printf '%.1f' "$COVERAGE_RAW")%"
            if awk "BEGIN {exit !($COVERAGE_RAW >= 90)}"; then COLOR="brightgreen"
            elif awk "BEGIN {exit !($COVERAGE_RAW >= 75)}"; then COLOR="yellow"
            else COLOR="red"
            fi
          fi
          jq -n --arg msg "$MSG" --arg color "$COLOR" \
            '{files: {"coverage-badge.json": {content: ({schemaVersion:1,label:"coverage",message:$msg,color:$color} | tojson)}}}' | \
          gh api -X PATCH /gists/d9b66c0da8123b3016aa5ec0e0ad47f0 --input -
        env:
          GH_TOKEN: ${{ secrets.GIST_TOKEN }}

      - name: Attach coverage summary to release
        if: github.event_name == 'release'
        run: gh release upload ${{ github.event.release.tag_name }} coverage-summary.json --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
